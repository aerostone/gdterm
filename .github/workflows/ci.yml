# gdterm — GitHub Actions CI（.NET Framework 4.6.2，Windows 权威构建）
#
# 背景（2026-11-03 沉淀）：AppVeyor 平台自 0.1.456 起 3 天+ 不接单（GitHub status 恒 0 条，
# 匿名日志/历史 API 均 404，平台侧无法自证），迁移验证门到 GitHub Actions（仓库内纯内容，
# 公开仓库免费分钟数无限，不依赖 AppVeyor webhook/平台存活）。
# 口径与 appveyor.yml 逐门对齐：restore → build → 单测 → UI 冒烟 → ui-tree-check → L2 矩阵 →
# perf-bench → 编码守卫 → ui-ux-lint → gen-tokens → feature-map。
# 哲学不变：证据先于宣判——无论成败都上传 test-run.log/冒烟 dump/门报告。
# 绿色版打包（ILRepack + FreeRDP）暂留 appveyor.yml；验证门绿稳后另批移植。
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# fast_finish 等价：同 ref 新推送取消旧 run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest   # VS2022（msbuild 17）+ Python 3 + NuGet CLI，均有
    timeout-minutes: 60
    env:
      CONFIGURATION: Release
    steps:
      - uses: actions/checkout@v4

      # net462 引用程序集：与本机 csc-check 同款 NuGet 包（1.0.3，全仓 320 文件编译已验证），
      # 用 FrameworkPathOverride 注入——不赌 runner 镜像是否预装 4.6.2 targeting pack。
      - name: Fetch net462 reference assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net462 -Version 1.0.3 -OutputDirectory packs -NonInteractive
          $ref = (Get-ChildItem packs -Recurse -Directory -Filter 'v4.6.2' | Select-Object -First 1).FullName
          if (-not $ref) { throw 'net462 reference assemblies not found under packs/' }
          Add-Content -Path $env:GITHUB_ENV -Value "REF_PATH=$ref"

      # GHA windows 镜像 PATH 不保证有 VS MSBuild（首次 run 实证：nuget 步骤过、msbuild 步骤挂）。
      # 三级兜底：PATH 已有 → vswhere 定位 VS MSBuild 加目录 → dotnet msbuild 垫片（SDK 预装必在）。
      # 注意：GITHUB_PATH 对当前步骤不生效，版本自证用解析到的绝对路径。
      - name: Ensure msbuild on PATH
        shell: pwsh
        run: |
          if (Get-Command msbuild -ErrorAction SilentlyContinue) {
            Write-Host "msbuild already on PATH"
            & (Get-Command msbuild).Source -version
            exit 0
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $exe = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
            if ($exe) {
              Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $exe)
              Write-Host "VS MSBuild found: $exe"
              & $exe -version
              exit 0
            }
          }
          $shim = Join-Path $env:RUNNER_TEMP 'msbuild.cmd'
          Set-Content -Path $shim -Value '@dotnet msbuild %*' -Encoding ASCII
          Add-Content -Path $env:GITHUB_PATH -Value $env:RUNNER_TEMP
          Write-Host "Falling back to dotnet msbuild shim: $shim"
          dotnet msbuild -version

      - name: Restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          msbuild gdterm.sln /t:Restore /p:Configuration=$env:CONFIGURATION /p:Platform="Any CPU" /v:m 2>&1 | Tee-Object -FilePath restore.log
          if ($LASTEXITCODE -ne 0) { throw "Package restore failed (restore.log in evidence)" }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          msbuild gdterm.sln /p:Configuration=$env:CONFIGURATION /p:Platform="Any CPU" /p:FrameworkPathOverride="$env:REF_PATH" /v:m 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { throw "Build failed exit=$LASTEXITCODE (build.log in evidence)" }

      - name: Unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $testExe = "src\Gdterm.Tests\bin\$env:CONFIGURATION\Gdterm.Tests.exe"
          if (-not (Test-Path $testExe)) {
            $alt = Get-ChildItem -Path src\Gdterm.Tests -Recurse -Filter Gdterm.Tests.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($alt) { $testExe = $alt.FullName }
          }
          if (-not (Test-Path $testExe)) { throw "Gdterm.Tests.exe not found" }
          Write-Host "Running $testExe"
          & $testExe 2>&1 | Tee-Object -FilePath test-run.log
          if ($LASTEXITCODE -ne 0) { throw "Tests failed exit=$LASTEXITCODE (test-run.log in evidence)" }

      # UI 冒烟：起窗体截图 + 断言（要桌面会话，GHA windows-latest 有）
      - name: UI smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $testExe = "src\Gdterm.Tests\bin\$env:CONFIGURATION\Gdterm.Tests.exe"
          # 输出必须落盘：冒烟红过而"只报一行 FAIL、dump 一张没有"时，没有 stdout 就无法定位
          & $testExe --ui-smoke "ui-smoke" 2>&1 | Tee-Object -FilePath ui-smoke.log
          exit $LASTEXITCODE

      # 全控件树校验门（R1-R6 + 自绘命中区）；零第三方依赖（仅 stdlib）
      - name: ui-tree-check gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          python tools\ui-tree-check.py ui-smoke 2>&1 | Tee-Object -FilePath ui-tree-check-report.txt
          exit $LASTEXITCODE

      # L3 像素指纹门（docs/UI-UX-VERIFICATION.md §4.3）：把"画面长什么样"压成
      # 平均亮度 / 近白近黑占比 / 主导色占比三组数，与 tools/ui-baseline/ 比对。
      # 阈值是按噪声实测定的（同镜像两次运行噪声 ≤0.002，真实外观变更 ≥0.13）。
      # 改了外观就跑 --write 更新基线并在 PR 里 review 那份 diff。
      - name: L3 pixel fingerprint gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          python tools\ui-pixel-fingerprint.py ui-smoke 2>&1 | Tee-Object -FilePath ui-pixel-report.txt
          exit $LASTEXITCODE

      # L2 矩阵门（docs/UI-UX-VERIFICATION.md §4.2）：同一批窗/面板在
      # DPI 100/150% × UI 字号 9/14pt × 主题 Dark/OLED 共 8 格下重跑，复用 ui-tree-check 的 R1-R6
      # （--dpi-factor 让逻辑阈值随该格系数走），再由 ui-matrix-check 做反空转比对：
      # 条件没生效（曲线全平）也判红——否则"跑了 8 格全绿"可能只是同一张图跑 8 遍。
      - name: UI matrix gate (DPI x font x theme)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          $testExe = "src\Gdterm.Tests\bin\$env:CONFIGURATION\Gdterm.Tests.exe"
          & $testExe --ui-matrix "ui-matrix" 2>&1 | Tee-Object -FilePath ui-matrix-run.log
          if ($LASTEXITCODE -ne 0) { throw "ui-matrix smoke failed exit=$LASTEXITCODE (ui-matrix-run.log)" }
          python tools\ui-matrix-check.py ui-matrix 2>&1 | Tee-Object -FilePath ui-matrix-report.txt
          exit $LASTEXITCODE

      # 渲染性能基准（P2-8）：崩溃（非零退出）才红
      - name: Render perf bench
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $testExe = "src\Gdterm.Tests\bin\$env:CONFIGURATION\Gdterm.Tests.exe"
          & $testExe --perf-bench perf-bench.json
          exit $LASTEXITCODE

      # 静态门六连：编码守卫 → L0 设计语言 → token SSOT → 功能完备性（棘轮）→ 安全闸门结构 → i18n 词典
      - name: Static gates (encoding / ui-ux-lint / gen-tokens / feature-map / sec-gate)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          python tools\check-encoding.py
          if ($LASTEXITCODE -ne 0) { throw "encoding guard failed exit=$LASTEXITCODE" }
          python tools\ui-ux-lint.py
          if ($LASTEXITCODE -ne 0) { throw "ui-ux-lint gate failed exit=$LASTEXITCODE" }
          python tools\gen-tokens.py --check
          if ($LASTEXITCODE -ne 0) { throw "gen-tokens check failed exit=$LASTEXITCODE" }
          python tools\feature-map.py --check --ascii
          if ($LASTEXITCODE -ne 0) { throw "feature-map gate failed exit=$LASTEXITCODE" }
          # 危险命令闸门结构门：`rm -rf /` 粘贴进来能绕过拦截这一类旁路，靠静态门长期守住
          python tools\check-sec-gate.py
          if ($LASTEXITCODE -ne 0) { throw "sec-gate failed exit=$LASTEXITCODE" }
          # i18n 词典门：新增 L10n.T 文案必须同步英文条目（"i18n 已完成"靠门守，不靠记性）
          python tools\check-i18n.py
          if ($LASTEXITCODE -ne 0) { throw "i18n gate failed exit=$LASTEXITCODE" }

      # 证据先于宣判：无论成败上传全部日志/dump/门报告
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          if-no-files-found: ignore
          path: |
            restore.log
            build.log
            test-run.log
            ui-smoke/
            ui-smoke.log
            ui-matrix/
            ui-matrix-run.log
            ui-matrix-report.txt
            ui-tree-check-report.txt
            ui-pixel-report.txt
            perf-bench.json
            perf-bench-crash.txt
            perf-seh.txt
            perf-progress.txt
