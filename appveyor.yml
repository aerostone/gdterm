# gdterm — AppVeyor CI for .NET Framework 4.6.2 (Win7 green portable)
# 权威构建在 Windows；Linux 开发机只做静态检查。
version: 0.1.{build}
image: Visual Studio 2022

configuration:
  - Release

platform: Any CPU

# FreeRDP 2.11.7 源码构建产物缓存：键随本文件变化失效，命中则跳过重编
# （官方已停发 2.x Windows 二进制，只能自建；详见 install 阶段）
cache:
  - freerdp-bin -> appveyor.yml

install:
  - ps: |
      # ===== FreeRDP 2.11.7 源码构建（wfreerdp 进程嵌入引擎）=====
      # 背景：wfreerdp.exe 是唯一支持 /parent-window 嵌入的客户端（3.x 已删且
      # sdl-freerdp 嵌入损坏 issue #12227），但官方不再发布 2.x Windows 二进制
      # （夜间构建只留最近 5 个且已切 3.x；GitHub Releases 仅源码包），
      # 故从官方源码自建并缓存。产物进 freerdp-bin\，打包阶段拷入 dist\gdterm\freerdp\。
      $ErrorActionPreference = 'Stop'
      $frBin = "$env:APPVEYOR_BUILD_FOLDER\freerdp-bin"
      if (Test-Path (Join-Path $frBin 'wfreerdp.exe')) {
        Write-Host "FreeRDP cache hit: $frBin"
        return
      }
      New-Item -ItemType Directory -Path $frBin -Force | Out-Null
      $ver = '2.11.7'
      $zipUrl = "https://github.com/FreeRDP/FreeRDP/releases/download/$ver/freerdp-$ver.zip"
      $zipFile = "$env:TEMP\freerdp-$ver.zip"
      Write-Host "Downloading FreeRDP source: $zipUrl"
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Invoke-WebRequest -Uri $zipUrl -OutFile $zipFile -UseBasicParsing
      # 官方 sha256 校验（供应链完整性）；DownloadString 恒返回字符串，
      # 避免 PS5.1 对非 HTML 内容把 Content 给成 byte[]
      $shaText = (New-Object Net.WebClient).DownloadString("$zipUrl.sha256")
      $sha = $shaText.Trim().Split(' ')[0]
      $actual = (Get-FileHash $zipFile -Algorithm SHA256).Hash.ToLower()
      if ($sha.ToLower() -ne $actual) { throw "FreeRDP sha256 mismatch expected=$sha actual=$actual" }
      Write-Host "FreeRDP source sha256 OK: $actual"
      $srcDir = "$env:TEMP\freerdp-src"
      if (Test-Path $srcDir) { Remove-Item -Recurse -Force $srcDir }
      Expand-Archive -Path $zipFile -DestinationPath $srcDir
      $root = Get-ChildItem $srcDir | Select-Object -First 1 -ExpandProperty FullName

      # ---- OpenSSL 开发库（探测预装路径，否则 choco 安装；2.x 强制依赖 OpenSSL）----
      function Find-OpenSslRoot {
        foreach ($p in @('C:\OpenSSL-Win64','C:\Program Files\OpenSSL-Win64','C:\Program Files\OpenSSL',
                         'C:\OpenSSL-v111-win64','C:\OpenSSL-v30-win64','C:\OpenSSL-v3-win64')) {
          if (Test-Path (Join-Path $p 'include\openssl\ssl.h')) { return $p }
        }
        return $null
      }
      $ossl = Find-OpenSslRoot
      if (-not $ossl) {
        Write-Host "Installing OpenSSL via Chocolatey..."
        choco install openssl --yes --no-progress | Out-Null
        $ossl = Find-OpenSslRoot
      }
      if (-not $ossl) { throw "OpenSSL development libraries not found after choco install" }
      Write-Host "OpenSSL root: $ossl"

      # ---- CMake 配置 + 编译（静态 CRT 免 VC redist、静态通道、最小依赖）----
      $bld = "$env:TEMP\freerdp-build"
      if (Test-Path $bld) { Remove-Item -Recurse -Force $bld }
      # CMake 4.x 移除了对 cmake_minimum_required(<3.5) 的兼容，
      # FreeRDP 2.11.7 声明的是 2.8 —— 用官方逃生门变量放行
      cmake -S $root -B $bld -G "Visual Studio 17 2022" -A x64 `
        "-DCMAKE_BUILD_TYPE=Release" `
        "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
        "-DOPENSSL_ROOT_DIR=$($ossl -replace '\\','/')" `
        "-DWITH_CLIENT_COMMON=ON" "-DWITH_CLIENT=ON" `
        "-DWITH_SERVER=OFF" "-DWITH_SERVER_CHANNELS=OFF" `
        "-DBUILD_TESTING=OFF" "-DWITH_SAMPLE=OFF" "-DWITH_MANPAGES=OFF" `
        "-DWITH_CAIRO=OFF" "-DWITH_JPEG=OFF" "-DWITH_SWSCALE=OFF" "-DWITH_DSP_FFMPEG=OFF" `
        "-DWITH_GSSAPI=OFF" "-DWITH_ICU=OFF" "-DCHANNEL_URBDRC=OFF" `
        "-DBUILTIN_CHANNELS=ON" "-DMSVC_RUNTIME=static"
      if ($LASTEXITCODE -ne 0) { throw "cmake configure failed exit=$LASTEXITCODE" }
      cmake --build $bld --config Release -- /m /v:m
      if ($LASTEXITCODE -ne 0) { throw "FreeRDP build failed exit=$LASTEXITCODE" }

      # ---- 收集产物：exe + 自家 DLL + OpenSSL 运行时 DLL ----
      foreach ($n in @('wfreerdp.exe','freerdp2.dll','winpr2.dll')) {
        $f = Get-ChildItem -Path $bld -Recurse -Filter $n -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($f) { Copy-Item $f.FullName $frBin -Force; Write-Host "Collected $($f.FullName)" }
        else { throw "Build output missing: $n" }
      }
      foreach ($pat in @('libcrypto-*.dll','libssl-*.dll')) {
        Get-ChildItem -Path $ossl -Recurse -Filter $pat -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -notmatch 'static' } |
          Select-Object -First 1 | ForEach-Object {
            Copy-Item $_.FullName $frBin -Force; Write-Host "Collected $($_.Name)"
          }
      }
      # Apache-2.0 许可证随分发保留
      $lic = Join-Path $root 'LICENSE'
      if (Test-Path $lic) { Copy-Item $lic (Join-Path $frBin 'LICENSE.FreeRDP.txt') -Force }
      Write-Host "===== FreeRDP engine ready: $((Get-ChildItem $frBin -File).Count) files ====="

# classic csproj + PackageReference：先 nuget restore，再 MSBuild Restore
before_build:
  - ps: |
      Write-Host "Restoring NuGet packages..."
      nuget restore gdterm.sln -NonInteractive
      if (-not $?) {
        Write-Host "nuget restore soft-fail; trying msbuild /t:Restore"
      }
      msbuild gdterm.sln /t:Restore /p:Configuration=$env:CONFIGURATION /p:Platform="Any CPU" /v:m
      if (-not $?) { throw "Package restore failed" }

build:
  project: gdterm.sln
  verbosity: minimal
  parallel: true

test_script:
  - ps: |
      $testExe = "src\Gdterm.Tests\bin\$env:CONFIGURATION\Gdterm.Tests.exe"
      if (-not (Test-Path $testExe)) {
        $alt = Get-ChildItem -Path src\Gdterm.Tests -Recurse -Filter Gdterm.Tests.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($alt) { $testExe = $alt.FullName }
      }
      if (-not (Test-Path $testExe)) { throw "Gdterm.Tests.exe not found" }
      Write-Host "Running $testExe"
      & $testExe
      if ($LASTEXITCODE -ne 0) { throw "Tests failed exit=$LASTEXITCODE" }

after_test:
  - ps: |
      # ===== 绿色版最小化打包 =====
      # 目标：托管 DLL 全部用 ILRepack 合进 gdterm.exe，产物只剩
      #   gdterm.exe + winpty.dll + winpty-agent.exe + winpty.exe + data/骨架
      # 删除所有 .txt / .pdb / .xml / .config 噪声文件。
      $ui = "src\Gdterm.UI\bin\$env:CONFIGURATION"
      if (-not (Test-Path (Join-Path $ui "gdterm.exe"))) {
        Write-Host "UI bin missing — skip portable artifact"
        return
      }

      $out = "dist\gdterm"
      if (Test-Path $out) { Remove-Item -Recurse -Force $out }
      New-Item -ItemType Directory -Path $out | Out-Null

      # 1) 先把 UI 输出目录所有东西拷过去（含 Gdterm.*.dll / Renci.SshNet.dll /
      #    KeePassLib.dll / VtNetCore.dll / gdterm.exe / *.pdb / *.xml / *.config）
      Copy-Item -Path (Join-Path $ui '*') -Destination $out -Recurse -Force

      # 2) 补齐 lib 下的 VtNetCore.dll（若 csproj 的 HintPath Private 没拷过来）
      if (Test-Path "lib\VtNetCore.dll") {
        Copy-Item "lib\VtNetCore.dll" $out -Force
      }

      # 3) winpty（Win7/Server2008 本地终端 PTY fallback —— 原生二进制，必须单文件留存）
      if (Test-Path "lib\winpty") {
        Copy-Item "lib\winpty\winpty.dll"      $out -Force
        Copy-Item "lib\winpty\winpty-agent.exe" $out -Force
        Copy-Item "lib\winpty\winpty.exe"     $out -Force
      }

      # 3b) FreeRDP（wfreerdp.exe 进程嵌入引擎 —— 许可证存储为文件，规避 MSLicensing 提权问题；
      #     放子目录 freerdp\ 以避开步骤 6 的顶层 *.dll 清理，原生 DLL 需与其 exe 同目录共存）
      #     来源优先级：lib\freerdp\（手工放置覆盖）> freerdp-bin\（install 阶段源码构建产物）
      $frSrc = $null
      if ((Test-Path "lib\freerdp\wfreerdp.exe") -or
          (Get-ChildItem "lib\freerdp" -Filter *.exe -ErrorAction SilentlyContinue)) {
        $frSrc = "lib\freerdp"
      } elseif (Test-Path "$env:APPVEYOR_BUILD_FOLDER\freerdp-bin\wfreerdp.exe") {
        $frSrc = "$env:APPVEYOR_BUILD_FOLDER\freerdp-bin"
      }
      if ($frSrc) {
        $frDir = Join-Path $out "freerdp"
        New-Item -ItemType Directory -Path $frDir -Force | Out-Null
        if ($frSrc -eq "lib\freerdp") { Copy-Item "lib\freerdp\*" $frDir -Recurse -Force }
        else { Copy-Item "$env:APPVEYOR_BUILD_FOLDER\freerdp-bin\*" $frDir -Force }
        Write-Host "Packed FreeRDP from ${frSrc}: $((Get-ChildItem $frDir -File).Count) files"
      } else {
        Write-Warning "No FreeRDP engine available — RDP falls back to mstscax ActiveX at runtime"
      }

      # 4) 从各项目 bin / NuGet 缓存补齐传递依赖（KeePassLib / SSH.NET）
      $depNames = @('KeePassLib.dll','Renci.SshNet.dll')
      foreach ($name in $depNames) {
        if (-not (Test-Path (Join-Path $out $name))) {
          $found = Get-ChildItem -Path src -Recurse -Filter $name -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'bin\\' + $env:CONFIGURATION } |
            Select-Object -First 1
          if (-not $found) {
            $found = Get-ChildItem -Path "$env:USERPROFILE\.nuget\packages" -Recurse -Filter $name -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if ($found) { Copy-Item $found.FullName $out -Force; Write-Host "Packed dependency: $name" }
          else { Write-Warning "Missing dependency in portable package: $name" }
        }
      }

      # 5) 安装 ILRepack 并合并所有托管 DLL 进 gdterm.exe
      #    用 dotnet global tool 装 ILRepack.Tool，并把 ~/.dotnet/tools 加到 PATH。
      # 不可达的 dotnet tool 路径刪除，直接用 NuGet 独立包（以免失败后兜底在 0.1.44 里已证仍引入传递依赖问题）
      # 5) 收集 out 下所有托管 DLL 作为 ILRepack 输入与 /lib 搜索路径
      $allDlls = Get-ChildItem -Path $out -Filter *.dll | Where-Object { $_.Name -ne 'winpty.dll' } | Select-Object -ExpandProperty FullName
      $primeExe = Join-Path $out 'gdterm.exe'
      $asmPaths = @($primeExe) + ($allDlls | Where-Object { $_ -ne $primeExe })
      Write-Host "[ILRepack] merging $($asmPaths.Count) files into gdterm.exe"
      # 安装独立 ILRepack NuGet 包（带 ILRepack.exe，不依赖 dotnet tool PATH）
      $pkgDir = Join-Path "$env:USERPROFILE\.nuget\packages" "ilrepack"
      if (-not (Test-Path (Join-Path $pkgDir '2.0.18'))) {
        nuget install ILRepack -Version 2.0.18 -OutputDirectory "$env:USERPROFILE\.nuget\packages" -NonInteractive -Verbosity quiet 2>$null
      }
      $ilrepack = Get-ChildItem -Path $pkgDir -Recurse -Filter "ILRepack.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
      if (-not $ilrepack) { throw "ILRepack.exe not found under $pkgDir" }
      Write-Host "ILRepack: $ilrepack"
      # git PackageReference 传递依赖（SSH.NET 2024.1.0 -> Microsoft.Bcl.AsyncInterfaces 等）
      $transitiveNames = @('Microsoft.Bcl.AsyncInterfaces.dll','System.Threading.Tasks.Extensions.dll','System.Memory.dll','System.Buffers.dll','System.Runtime.CompilerServices.Unsafe.dll','System.Numerics.Vectors.dll','System.ValueTuple.dll')
      foreach ($name in $transitiveNames) {
        if (-not (Test-Path (Join-Path $out $name))) {
          $found = Get-ChildItem -Path src -Recurse -Filter $name -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'bin\\' + $env:CONFIGURATION } |
            Select-Object -First 1
          if ($found) { Copy-Item $found.FullName $out -Force; Write-Host "Packed transitive: $name" }
        }
      }
      # PowerShell 调 ILRepack：长参数语法 --out=FILE / --lib=DIR 避免 NDesk.Options
      # 在 '/out:val' 形式下把后续 '/' 开头的开关吞进 out 路径 (ILRepack 2.0.18 已知parse怪癖)。
      $outExe = Join-Path $out 'gdterm.exe'
      $argsArr = @("--out=$outExe", "--lib=$out", '/wildcards', '/copyattrs', '/allowdup', '/internalize') + $asmPaths
      & $ilrepack $argsArr
      if ($LASTEXITCODE -ne 0) { throw "ILRepack failed exit=$LASTEXITCODE" }

      # 6) 合并完成后删除被合并进 exe 的所有托管 DLL（winpty.dll 是原生保留）
      foreach ($n in (Get-ChildItem -Path $out -Filter *.dll | Where-Object { $_.Name -ne 'winpty.dll' } | Select-Object -ExpandProperty Name)) {
        Remove-Item (Join-Path $out $n) -Force
      }

      # 7) 删除噪声文件：.pdb / .xml / .config / .txt（含 LICENSE.winpty.txt、README 等）
      #    排除 freerdp\ 子目录：Apache-2.0 要求随分发保留许可证文本
      Get-ChildItem -Path $out -Recurse -File |
        Where-Object { $_.Extension -in '.pdb','.xml','.config','.txt' -and $_.FullName -notmatch '\\freerdp\\' } |
        ForEach-Object { Remove-Item $_.FullName -Force; Write-Host "Removed noise: $($_.Name)" }

      # 8) 便携数据骨架（空 —— 无密钥）
      New-Item -ItemType Directory -Path (Join-Path $out "data\config\tools") -Force | Out-Null
      New-Item -ItemType Directory -Path (Join-Path $out "data\logs") -Force | Out-Null

      # 9) 最终产物清单（应该只剩个位数文件）
      Write-Host ""
      Write-Host "===== Portable layout (final) ====="
      Get-ChildItem $out -File | ForEach-Object { Write-Host ("  {0,-25} {1,8:N0} bytes" -f $_.Name, $_.Length) }
      Write-Host "===== Total files: $((Get-ChildItem $out -File).Count) ====="
      Write-Host "Portable layout ready: $out"

artifacts:
  - path: dist\gdterm
    name: gdterm-portable
    type: zip

branches:
  only:
    - master
    - main

matrix:
  fast_finish: true
