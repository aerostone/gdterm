# gdterm — AppVeyor CI for .NET Framework 4.6.2 (Win7 green portable)
# 权威构建在 Windows；Linux 开发机只做静态检查。
version: 0.1.{build}
image: Visual Studio 2022

configuration:
  - Release

platform: Any CPU

# FreeRDP 2.11.7 源码构建产物缓存：键随 appveyor.yml 或构建脚本变化失效，命中则跳过重编
# （官方已停发 2.x Windows 二进制，只能自建；详见 tools/build-freerdp.ps1）
cache:
  - freerdp-bin -> appveyor.yml, tools/build-freerdp.ps1

install:
  - ps: |
      # ===== FreeRDP 2.11.7 源码构建（从独立脚本运行，避免内联脚本超长触发
      # Windows 事件日志 32766 字符上限 =====
      powershell -ExecutionPolicy Bypass -File "$env:APPVEYOR_BUILD_FOLDER\tools\build-freerdp.ps1"
      if ($LASTEXITCODE -ne 0) { throw "build-freerdp.ps1 failed exit=$LASTEXITCODE" }
before_build:
  - ps: |
      Write-Host "Restoring NuGet packages..."
      nuget restore gdterm.sln -NonInteractive
      if (-not $?) {
        Write-Host "nuget restore soft-fail; trying msbuild /t:Restore"
      }
      msbuild gdterm.sln /t:Restore /p:Configuration=$env:CONFIGURATION /p:Platform="Any CPU" /v:m
      if (-not $?) { throw "Package restore failed" }

build:
  project: gdterm.sln
  verbosity: minimal
  parallel: true

test_script:
  - ps: |
      $testExe = "src\Gdterm.Tests\bin\$env:CONFIGURATION\Gdterm.Tests.exe"
      if (-not (Test-Path $testExe)) {
        $alt = Get-ChildItem -Path src\Gdterm.Tests -Recurse -Filter Gdterm.Tests.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($alt) { $testExe = $alt.FullName }
      }
      if (-not (Test-Path $testExe)) { throw "Gdterm.Tests.exe not found" }
      Write-Host "Running $testExe"
      & $testExe
      if ($LASTEXITCODE -ne 0) { throw "Tests failed exit=$LASTEXITCODE" }

after_test:
  - ps: |
      # ===== 绿色版最小化打包 =====
      # 目标：托管 DLL 全部用 ILRepack 合进 gdterm.exe，产物只剩
      #   gdterm.exe + winpty.dll + winpty-agent.exe + winpty.exe + data/骨架
      # 删除所有 .txt / .pdb / .xml / .config 噪声文件。
      $ui = "src\Gdterm.UI\bin\$env:CONFIGURATION"
      if (-not (Test-Path (Join-Path $ui "gdterm.exe"))) {
        Write-Host "UI bin missing — skip portable artifact"
        return
      }

      # ===== 步骤 0：入库二进制完整性自检 =====
      # 指纹钉在下方；更换任何 lib 二进制必须同步更新对应常量并在提交说明里写明来源
      $pins = [ordered]@{
        'lib\winpty\winpty.dll'       = '5d892d04b5051d998907147c514f6ae058e5d0bbbf98e2ed78cd1d30dd5d0360'
        'lib\winpty\winpty-agent.exe' = '84f6ce4535f7f3e09b2aef7d833b9a99ba675b304576d188a1db349246e41378'
        'lib\winpty\winpty.exe'       = '1a8e92e0b03f7f83aa344b0dcfd141354b5bdaf6c824edbe872a95ab996d87b6'
        'vendor\fzf\fzf.exe'             = '2c14a927c1ce5bad37e80630685e3149d442a55594a935c57548742b9dc2b9b2'
        'vendor\fd\fd.exe'               = 'c089c9ee1e412a111d65c917a95c757b4e192041f316a52535bfaa3e9e03429f'
      }
      foreach ($k in $pins.Keys) {
        $p = Join-Path $env:APPVEYOR_BUILD_FOLDER $k
        if (-not (Test-Path $p)) { throw "Bundled binary missing: $k" }
        $h = (Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
        if ($h -ne $pins[$k]) { throw "Binary integrity FAIL: $k expected=$($pins[$k]) actual=$h" }
      }
      Write-Host "Bundled binaries sha256 verified: $($pins.Count) files OK"

      $out = "dist\gdterm"
      if (Test-Path $out) { Remove-Item -Recurse -Force $out }
      New-Item -ItemType Directory -Path $out | Out-Null

      # 1) 先把 UI 输出目录所有东西拷过去（含 Gdterm.*.dll / Renci.SshNet.dll /
      #    KeePassLib.dll / VtNetCore.dll / gdterm.exe / *.pdb / *.xml / *.config）
      Copy-Item -Path (Join-Path $ui '*') -Destination $out -Recurse -Force

      # 2) 补齐 lib 下的 VtNetCore.dll（若 csproj 的 HintPath Private 没拷过来）
      if (Test-Path "lib\VtNetCore.dll") {
        Copy-Item "lib\VtNetCore.dll" $out -Force
      }

      # 3) winpty（Win7/Server2008 本地终端 PTY fallback）—— 原生二进制集中放 lib\，
      #     winpty.dll 与 winpty-agent.exe 必须同目录（dll 启动 agent）；
      #     运行时 Program.cs 已 SetDllDirectory(lib) 让 DllImport(winpty.dll) 定位 lib\。
      if (Test-Path "lib\winpty") {
        $libDir = Join-Path $out "lib"
        New-Item -ItemType Directory -Path $libDir -Force | Out-Null
        Copy-Item "lib\winpty\winpty.dll"      $libDir -Force
        Copy-Item "lib\winpty\winpty-agent.exe" $libDir -Force
        Copy-Item "lib\winpty\winpty.exe"     $libDir -Force
      }

      # 3b) FreeRDP（wfreerdp.exe 进程嵌入引擎）—— 集中放 lib\freerdp\（业界 bin/lib 分类），
      #     原生 DLL 需与 exe 同目录共存；许可证文件随子目录保留（Apache-2.0 要求）。
      #     来源优先级：vendor\freerdp\（手工放置覆盖）> freerdp-bin\（install 阶段源码构建产物）
      $frSrc = $null
      if ((Test-Path "vendor\freerdp\wfreerdp.exe") -or
          (Get-ChildItem "vendor\freerdp" -Filter *.exe -ErrorAction SilentlyContinue)) {
        $frSrc = "vendor\freerdp"
      } elseif (Test-Path "$env:APPVEYOR_BUILD_FOLDER\freerdp-bin\wfreerdp.exe") {
        $frSrc = "$env:APPVEYOR_BUILD_FOLDER\freerdp-bin"
      }
      if ($frSrc) {
        $frDir = Join-Path $out "lib\freerdp"
        New-Item -ItemType Directory -Path $frDir -Force | Out-Null
        if ($frSrc -eq "vendor\freerdp") { Copy-Item "vendor\freerdp\*" $frDir -Recurse -Force }
        else { Copy-Item "$env:APPVEYOR_BUILD_FOLDER\freerdp-bin\*" $frDir -Force }
        Write-Host "Packed FreeRDP from ${frSrc}: $((Get-ChildItem $frDir -File).Count) files"

        # 打包后的引擎同样必须可加载（防拷贝步骤遗漏 DLL；SetErrorMode 防缺 DLL 弹框挂死 CI）
        if (-not ([System.Management.Automation.PSTypeName]'Native.Kernel32').Type) {
          Add-Type -Namespace Native -Name Kernel32 -MemberDefinition '
            [DllImport("kernel32.dll")] public static extern uint SetErrorMode(uint uMode);'
        }
        [Native.Kernel32]::SetErrorMode(3) | Out-Null
        $pi2 = New-Object System.Diagnostics.ProcessStartInfo
        $pi2.FileName = Join-Path (Join-Path $env:APPVEYOR_BUILD_FOLDER 'dist\gdterm\lib\freerdp') 'wfreerdp.exe'
        $pi2.WorkingDirectory = $env:APPVEYOR_BUILD_FOLDER
        $pi2.Arguments = '/version'
        $pi2.UseShellExecute = $false; $pi2.CreateNoWindow = $true; $pi2.RedirectStandardOutput = $true
        $proc2 = [System.Diagnostics.Process]::Start($pi2)
        $null = $proc2.StandardOutput.ReadToEnd()
        if (-not $proc2.WaitForExit(20000)) { try { $proc2.Kill() } catch {}; throw "packed wfreerdp /version timeout" }
        if ($proc2.ExitCode -ne 0) { throw "packed wfreerdp cannot load (exit=$($proc2.ExitCode)) — lib\freerdp\ 目录缺运行库 DLL" }
        Write-Host "Packed FreeRDP smoke OK (exit=$($proc2.ExitCode))"
      } else {
        Write-Warning "No FreeRDP engine available — RDP falls back to mstscax ActiveX at runtime"
      }

      # 3c) fzf / fd（本地终端随附 CLI 工具）—— 业界布局 bin\ 放可执行；运行时 Program.cs
      #     把 bin\ 加入 PATH，终端子进程直接敲 fzf/fd 即可用。
      #     均为官方 Win7 兼容版：fzf v0.65.2（末代 Win7 支持）、fd v10.2.0（Rust 1.77 锁定构建）
      $binDir = Join-Path $out "bin"
      New-Item -ItemType Directory -Path $binDir -Force | Out-Null
      foreach ($tool in @('fzf','fd')) {
        $exe = "vendor\${tool}\${tool}.exe"
        if (Test-Path $exe) {
          Copy-Item "vendor\${tool}\*" $binDir -Recurse -Force
          Write-Host ("Packed {0} into bin\" -f $tool)
        } else {
          Write-Warning "vendor\${tool}\${tool}.exe missing - skipped"
        }
      }

      # 4) 从各项目 bin / NuGet 缓存补齐传递依赖（KeePassLib / SSH.NET）
      $depNames = @('KeePassLib.dll','Renci.SshNet.dll')
      foreach ($name in $depNames) {
        if (-not (Test-Path (Join-Path $out $name))) {
          $found = Get-ChildItem -Path src -Recurse -Filter $name -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'bin\\' + $env:CONFIGURATION } |
            Select-Object -First 1
          if (-not $found) {
            $found = Get-ChildItem -Path "$env:USERPROFILE\.nuget\packages" -Recurse -Filter $name -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if ($found) { Copy-Item $found.FullName $out -Force; Write-Host "Packed dependency: $name" }
          else { Write-Warning "Missing dependency in portable package: $name" }
        }
      }

      # 5) 安装 ILRepack 并合并所有托管 DLL 进 gdterm.exe
      #    用 dotnet global tool 装 ILRepack.Tool，并把 ~/.dotnet/tools 加到 PATH。
      # 不可达的 dotnet tool 路径刪除，直接用 NuGet 独立包（以免失败后兜底在 0.1.44 里已证仍引入传递依赖问题）
      # 5) 收集 out 下所有托管 DLL 作为 ILRepack 输入与 /lib 搜索路径
      $allDlls = Get-ChildItem -Path $out -Filter *.dll | Where-Object { $_.Name -ne 'winpty.dll' } | Select-Object -ExpandProperty FullName
      $primeExe = Join-Path $out 'gdterm.exe'
      $asmPaths = @($primeExe) + ($allDlls | Where-Object { $_ -ne $primeExe })
      Write-Host "[ILRepack] merging $($asmPaths.Count) files into gdterm.exe"
      # 安装独立 ILRepack NuGet 包（带 ILRepack.exe，不依赖 dotnet tool PATH）
      $pkgDir = Join-Path "$env:USERPROFILE\.nuget\packages" "ilrepack"
      if (-not (Test-Path (Join-Path $pkgDir '2.0.18'))) {
        nuget install ILRepack -Version 2.0.18 -OutputDirectory "$env:USERPROFILE\.nuget\packages" -NonInteractive -Verbosity quiet 2>$null
      }
      $ilrepack = Get-ChildItem -Path $pkgDir -Recurse -Filter "ILRepack.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
      if (-not $ilrepack) { throw "ILRepack.exe not found under $pkgDir" }
      Write-Host "ILRepack: $ilrepack"
      # SSH.NET 2026.0.0 传递依赖（-> BouncyCastle.Cryptography / Microsoft.Bcl.Cryptography / Microsoft.Extensions.Logging.Abstractions）
      # 旧版 2024.1.0 经 SshNet.Security 引入的 Microsoft.Bcl.AsyncInterfaces 等一并保留：
      # 未被引用时不会出现在 bin，下方循环 Test-Path 为假即跳过，零副作用。
      $transitiveNames = @('BouncyCastle.Cryptography.dll','Microsoft.Bcl.Cryptography.dll','Microsoft.Extensions.Logging.Abstractions.dll','Microsoft.Bcl.AsyncInterfaces.dll','System.Threading.Tasks.Extensions.dll','System.Memory.dll','System.Buffers.dll','System.Runtime.CompilerServices.Unsafe.dll','System.Numerics.Vectors.dll','System.ValueTuple.dll')
      foreach ($name in $transitiveNames) {
        if (-not (Test-Path (Join-Path $out $name))) {
          $found = Get-ChildItem -Path src -Recurse -Filter $name -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'bin\\' + $env:CONFIGURATION } |
            Select-Object -First 1
          if ($found) { Copy-Item $found.FullName $out -Force; Write-Host "Packed transitive: $name" }
        }
      }
      # PowerShell 调 ILRepack：长参数语法 --out=FILE / --lib=DIR 避免 NDesk.Options
      # 在 '/out:val' 形式下把后续 '/' 开头的开关吞进 out 路径 (ILRepack 2.0.18 已知parse怪癖)。
      $outExe = Join-Path $out 'gdterm.exe'
      $argsArr = @("--out=$outExe", "--lib=$out", '/wildcards', '/copyattrs', '/allowdup', '/internalize') + $asmPaths
      & $ilrepack $argsArr
      if ($LASTEXITCODE -ne 0) { throw "ILRepack failed exit=$LASTEXITCODE" }

      # 6) 合并完成后删除被合并进 exe 的所有托管 DLL（原生 winpty.dll 已在 lib\ 不受影响）
      foreach ($n in (Get-ChildItem -Path $out -Filter *.dll | Where-Object { $_.Name -ne 'winpty.dll' } | Select-Object -ExpandProperty Name)) {
        Remove-Item (Join-Path $out $n) -Force
      }

      # 7) 删除噪声文件：.pdb / .xml / .config / .txt（含 LICENSE.winpty.txt、README 等）
      #    排除 freerdp\ 子目录：Apache-2.0 要求随分发保留许可证文本
      Get-ChildItem -Path $out -Recurse -File |
        Where-Object { $_.Extension -in '.pdb','.xml','.config','.txt' -and $_.FullName -notmatch '\\lib\\freerdp\\' } |
        ForEach-Object { Remove-Item $_.FullName -Force; Write-Host "Removed noise: $($_.Name)" }

      # 8) 便携数据骨架（空 —— 无密钥）
      New-Item -ItemType Directory -Path (Join-Path $out "data\config\tools") -Force | Out-Null
      New-Item -ItemType Directory -Path (Join-Path $out "data\logs") -Force | Out-Null

      # 9) 最终产物清单：顶层仅 gdterm.exe + SHA256SUMS.txt，原生依赖分类入 bin\lib\
      Write-Host ""
      Write-Host "===== Portable layout (final) ====="
      Get-ChildItem $out -File | ForEach-Object { Write-Host ("  {0,-25} {1,8:N0} bytes" -f $_.Name, $_.Length) }
      foreach ($sub in @('bin','lib','data')) {
        $sd = Join-Path $out $sub
        if (Test-Path $sd) { Write-Host ("  [{0}\\] {1} files" -f $sub, (Get-ChildItem $sd -Recurse -File).Count) }
      }
      Write-Host "===== Top-level files: $((Get-ChildItem $out -File).Count) ====="
      Write-Host "Portable layout ready: $out"

      # 10) 发布校验和：SHA256SUMS.txt 随包分发（用户可逐文件核验），
      #     相对路径格式与 sha256sum -c 兼容；内容纯 ASCII，避免 BOM 干扰首行哈希
      $outRoot = (Resolve-Path $out).Path
      $lines = Get-ChildItem $out -Recurse -File |
        ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.FullName.Substring($outRoot.Length + 1) }
      Set-Content -Path (Join-Path $outRoot 'SHA256SUMS.txt') -Value $lines -Encoding Ascii
      Write-Host "SHA256SUMS.txt written: $($lines.Count) entries"

artifacts:
  - path: dist\gdterm
    name: gdterm-portable
    type: zip

branches:
  only:
    - master
    - main

matrix:
  fast_finish: true
