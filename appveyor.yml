# gdterm — AppVeyor CI for .NET Framework 4.6.2 (Win7 green portable)
# 权威构建在 Windows；Linux 开发机只做静态检查。
version: 0.1.{build}
image: Visual Studio 2022

configuration:
  - Release

platform: Any CPU

# FreeRDP 2.11.7 源码构建产物缓存：键随本文件变化失效，命中则跳过重编
# （官方已停发 2.x Windows 二进制，只能自建；详见 install 阶段）
cache:
  - freerdp-bin -> appveyor.yml

install:
  - ps: |
      # ===== FreeRDP 2.11.7 源码构建（wfreerdp 进程嵌入引擎）=====
      # 背景：wfreerdp.exe 是唯一支持 /parent-window 嵌入的客户端（3.x 已删且
      # sdl-freerdp 嵌入损坏 issue #12227），但官方不再发布 2.x Windows 二进制
      # （夜间构建只留最近 5 个且已切 3.x；GitHub Releases 仅源码包），
      # 故从官方源码自建并缓存。产物进 freerdp-bin\，打包阶段拷入 dist\gdterm\freerdp\。
      $ErrorActionPreference = 'Stop'
      $frBin = "$env:APPVEYOR_BUILD_FOLDER\freerdp-bin"
      if (Test-Path (Join-Path $frBin 'wfreerdp.exe')) {
        Write-Host "FreeRDP cache hit: $frBin"
        return
      }
      New-Item -ItemType Directory -Path $frBin -Force | Out-Null
      $ver = '2.11.7'
      $zipUrl = "https://github.com/FreeRDP/FreeRDP/releases/download/$ver/freerdp-$ver.zip"
      $zipFile = "$env:TEMP\freerdp-$ver.zip"
      Write-Host "Downloading FreeRDP source: $zipUrl"
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Invoke-WebRequest -Uri $zipUrl -OutFile $zipFile -UseBasicParsing
      # 供应链校验（防同源自指）：主判据是 yml 内钉死的指纹——若只比远端 .sha256，
      # 攻击者把 zip 和 .sha256 一起换掉校验照样通过。远端文件仅作交叉比对日志。
      # 升级 FreeRDP 版本时必须人工核对官方发布页后更新此常量！
      $shaPin = 'b773f36d3972199e799502bd3418daab74c573fa31e1e2c37c322f2b4d810a0e'
      $actual = (Get-FileHash $zipFile -Algorithm SHA256).Hash.ToLower()
      if ($actual -ne $shaPin) { throw "FreeRDP sha256 PIN mismatch pin=$shaPin actual=$actual" }
      try {
        # DownloadString 恒返回字符串，避免 PS5.1 对非 HTML 内容把 Content 给成 byte[]
        $remoteSha = ((New-Object Net.WebClient).DownloadString("$zipUrl.sha256")).Trim().Split(' ')[0].ToLower()
        if ($remoteSha -ne $shaPin) { Write-Host "WARNING: remote .sha256 differs from pinned: $remoteSha (pin wins)" }
        else { Write-Host "FreeRDP source sha256 OK (pinned, remote agrees): $actual" }
      } catch { Write-Host "NOTE: remote .sha256 fetch failed - pinned check already passed" }
      $srcDir = "$env:TEMP\freerdp-src"
      if (Test-Path $srcDir) { Remove-Item -Recurse -Force $srcDir }
      Expand-Archive -Path $zipFile -DestinationPath $srcDir
      $root = Get-ChildItem $srcDir | Select-Object -First 1 -ExpandProperty FullName

      # ---- 补丁：未解析 PDU 落盘 hex dump ----
      # 背景堡垒机常发送 FreeRDP 2.x 不认识的 PDU（logonErrorInfo 变体等），
      # rdp.c 只打一句 "not properly parsed, N bytes remaining" 就跳过，
      # 客户端看不到内容，无法判断踢出原因。在 WARN 后追加 winpr_HexDump，
      # 输出剩余字节（随 FreeRdp.pdu 标签进 diag.log）。
      # 定位锚点为 rdp.c 中 WLog_WARN(... "pduType %s not properly parsed ...") 块。
      $rdpC = Join-Path $root 'libfreerdp\core\rdp.c'
      $src = Get-Content $rdpC -Raw
      $anchor = 'pdu_type_to_str(pduType), diff);'
      if ($src -notlike "*$anchor*") { throw "patch anchor not found in rdp.c" }
      $patched = $src -replace [regex]::Escape($anchor),
        "$anchor`n`t`t`t`t  winpr_HexDump(TAG, WLOG_WARN, Stream_Pointer(&sub), diff);"
      # 补 winpr/print.h：winpr_HexDump 声明所在头文件，rdp.c 默认未包含
      $patched = $patched -replace '#include <winpr/crt.h>',
        "#include <winpr/crt.h>`n#include <winpr/print.h>"
      Set-Content -Path $rdpC -Value $patched -NoNewline
      Write-Host "Patched rdp.c: unhandled PDU hex dump enabled"

      # ---- 补丁：转发到目标服务器时清空凭据（默认自协商，零配置）----
      # 堡垒机场景：首连用 keepass 凭据自动登录；但 FreeRDP 内部 redirect 重连
      # （rdp_client_redirect）会把命令行 /u /p 原样带到转发目标服务器——
      # rdp.c 只对 Username/Domain 做 LB_ 标志替换，Password 永不变，
      # 目标收到旧的自动登录凭据 → LOGOFF_BY_USER 踢线。
      # 补丁：无论 redirect 类型（含 LB_LOAD_BALANCE_INFO 路由 token），
      # 重连前清空 Username/Password/Domain 并关闭 AutoLogonEnabled，目标自协商显示自己的登录界面
      # （与 mstsc 行为一致）；会话路由由 LB token 本身承载，与凭据无关。
      # 实测：v0.1.149 日志显示 LB token 重连仍带旧 AUTOLOGON 凭据 0.1s 内被踢，
      # 故清除必须无条件执行；网关通过 LB_* 标志下发的权威新凭据则保留。
      # 锚点：rdp_client_redirect 内 `status = rdp_client_connect(rdp);`
      # （后随 reconnect_channels(rdp, TRUE) 的只有 redirect，reconnect 用 FALSE）。
      $connC = Join-Path $root 'libfreerdp\core\connection.c'
      $src2 = Get-Content $connC -Raw
      $anchor2 = "status = rdp_client_connect(rdp);`n`n`tif (status)`n`t`tstatus = rdp_client_reconnect_channels(rdp, TRUE);"
      if ($src2 -notlike "*$anchor2*") { throw "patch anchor not found in connection.c" }
      $clearBlock = "`t/* gdterm patch: MS-RDPBCGR 2.2.13.1 - on server redirection,`n`t * only fields the server flagged (LB_USERNAME/LB_DOMAIN/LB_PASSWORD) are`n`t * authoritative; unflagged fields MUST NOT be reused. FreeRDP bug:`n`t * rdp_client_redirect never clears Password, so the stale first-connect`n`t * /u /p reaches the redirect reconnect and gets LOGOFF_BY_USER (verified`n`t * 2026-08-30: with LB_LOAD_BALANCE_INFO token the reconnect re-sent the`n`t * old autologon credentials and was kicked in 0.1s). Clear unflagged`n`t * credential fields unconditionally so the target self-negotiates its`n`t * login (mstsc behavior); session routing is carried by the LB token. */`n`tWLog_INFO(TAG, `"gdterm redirect: flags=0x%x LB=%d USER=%d DOMAIN=%d PASS=%d AutoLogon=%d LBI=%d`", (unsigned)settings->RedirectionFlags, !!(settings->RedirectionFlags & LB_LOAD_BALANCE_INFO), !!(settings->RedirectionFlags & LB_USERNAME), !!(settings->RedirectionFlags & LB_DOMAIN), !!(settings->RedirectionFlags & LB_PASSWORD), (int)settings->AutoLogonEnabled, (int)settings->LoadBalanceInfoLength);`n`tif (settings->LoadBalanceInfo && (settings->LoadBalanceInfoLength > 0))`n`t{`n`t`tWLog_INFO(TAG, `"gdterm redirect LB token bytes (gdterm hexdump):`");`n`t`twinpr_HexDump(TAG, WLOG_INFO, settings->LoadBalanceInfo, (int)settings->LoadBalanceInfoLength);`n`t}`n`tif (!(settings->RedirectionFlags & LB_USERNAME))`n`t{`n`t`tfree(settings->Username);`n`t`tsettings->Username = NULL;`n`t}`n`tif (!(settings->RedirectionFlags & LB_DOMAIN))`n`t{`n`t`tfree(settings->Domain);`n`t`tsettings->Domain = NULL;`n`t}`n`tif (!(settings->RedirectionFlags & LB_PASSWORD))`n`t{`n`t`tfree(settings->Password);`n`t`tsettings->Password = NULL;`n`t}`n`tsettings->AutoLogonEnabled = FALSE;`n`n`t/* gdterm patch: lock reconnect security to the already-negotiated mode.`n`t * Wire proof (v0.1.161 rdp-dump): this gateway's LB-token resumption ONLY`n`t * continues sessions in the first leg's security mode - a token CR asking`n`t * for SSL|NLA (0x3) is DPU-kicked right after client info (c57074), while a`n`t * token CR asking legacy RDP (0x0) runs the full session (c57179 = mstsc).`n`t * FreeRDP rebuilds nego from the Tls/Nla settings flags on every connect,`n`t * so the redirect reconnect would re-request 0x3 and die. mstsc reuses the`n`t * first session's negotiated protocol; do the same for LB-token redirects. */`n`tif ((settings->RedirectionFlags & LB_LOAD_BALANCE_INFO) &&`n`t    (settings->SelectedProtocol == PROTOCOL_RDP))`n`t{`n`t`tWLog_INFO(TAG, `"gdterm redirect: lock reconnect to negotiated legacy RDP`");`n`t`tsettings->TlsSecurity = FALSE;`n`t`tsettings->NlaSecurity = FALSE;`n`t`tsettings->ExtSecurity = FALSE;`n`t`tsettings->RdpSecurity = TRUE;`n`t}`n"
      $patched2 = $src2 -replace [regex]::Escape($anchor2), ($clearBlock + $anchor2)
      # winpr/print.h: winpr_HexDump declaration, connection.c does not include it
      $patched2 = $patched2 -replace '#include <winpr/crt.h>', "#include <winpr/crt.h>`n#include <winpr/print.h>"
      Set-Content -Path $connC -Value $patched2 -NoNewline
      Write-Host "Patched connection.c: redirect clears unflagged credentials unconditionally"

      # ---- info.c: 重连（redirect）后 Client Info Packet 实际内容诊断 ----
      # FreeRDP 重连时 info_send_client_info_packet 会把 settings->Username/Password 写进包；
      # 我们的 connection.c patch 已清空凭据；这里打印实际写入包的 flags/cbUser/cbPass 验证。
      $infC = Join-Path $root 'libfreerdp\core\info.c'
      $src3 = Get-Content $infC -Raw
      $anchor3 = "cbWorkingDir = cbWorkingDir >= 2 ? cbWorkingDir - 2 : cbWorkingDir;`n`tStream_Write_UINT32(s, settings->KeyboardCodePage); /* CodePage (4 bytes) */"
      if ($src3 -notlike "*$anchor3*") { throw "patch anchor not found in info.c" }
      $infoLog = "`tWLog_INFO(TAG, `"gdterm redirect client info: flags=0x%x AUTOLOGON=%d cbUser=%d cbPass=%d user=%s usedCookie=%d cbArc=%d dom=%d`", flags, !!(flags & INFO_AUTOLOGON), cbUserName, cbPassword, settings->Username ? settings->Username : `"(null)`", usedPasswordCookie, (int)settings->ServerAutoReconnectCookie->cbLen, (int)cbDomain);"
      $patched3 = $src3.Replace($anchor3, $infoLog + $anchor3)
      # ---- info.c: SAVE_SESSION_INFO infoType (does the bastion send an ARC cookie) ----
      $anchor6 = "Stream_Read_UINT32(s, infoType); /* infoType (4 bytes) */"
      if ($src3.Contains($anchor6) -eq $false) { throw "patch anchor6 not found in info.c" }
      $ssLog = "`tWLog_INFO(TAG, `"gdterm redirect save session info: type=0x%x`", infoType);`n"
      $patched3 = $patched3.Replace($anchor6, ($anchor6 + "`n" + $ssLog))
      # ---- info.c: LogonErrorInfo (server-side logon error notification) ----
      $anchor7 = "Stream_Read_UINT32(s, errorNotificationData); /* errorNotificationData (4 bytes) */"
      if ($src3.Contains($anchor7) -eq $false) { throw "patch anchor7 not found in info.c" }
      $leLog = "`tWLog_INFO(TAG, `"gdterm redirect logon error info: type=0x%x data=0x%x`", errorNotificationType, errorNotificationData);`n"
      $patched3 = $patched3.Replace($anchor7, ($anchor7 + "`n" + $leLog))
      Set-Content -Path $infC -Value $patched3 -NoNewline
      Write-Host "Patched info.c: client info + save-session-info + LogonErrorInfo diagnostics"
      # ---- info.c: hex dump full Client Info PDU (before rdp_send) ----
      # rdp_send_client_info builds the stream via rdp_write_info_packet (basic) +
      # rdp_write_extended_info_packet (extraInfo). Dump the full PDU before sending.
      $anchor11 = "return rdp_send(rdp, s, MCS_GLOBAL_CHANNEL_ID);"
      if ($patched3.Contains($anchor11) -eq $false) { throw "patch anchor11 not found in info.c" }
      $ciDump = "`tWLog_INFO(TAG, `"gdterm redirect client info pdu (%d bytes) (gdterm hexdump):`", (int)Stream_Length(s));`n`twinpr_HexDump(TAG, WLOG_INFO, Stream_Buffer(s), (int)Stream_Length(s));`n"
      $patched3 = $patched3.Replace($anchor11, ($ciDump + $anchor11))
      # winpr/print.h for winpr_HexDump in info.c
      $patched3 = $patched3 -replace '#include <winpr/crt.h>', "#include <winpr/crt.h>`n#include <winpr/print.h>"
      Set-Content -Path $infC -Value $patched3 -NoNewline
      Write-Host "Patched info.c: client info PDU hex dump"


      # ---- negotiation.c: X.224 请求实际携带的 routing token / cookie 诊断 ----
      $negoC = Join-Path $root 'libfreerdp\core\nego.c'
      $src4 = Get-Content $negoC -Raw
      $anchor4 = "`tif (nego->RoutingToken)`n`t{`n`t`tStream_Write(s, nego->RoutingToken, nego->RoutingTokenLength);"
      if ($src4 -notlike "*$anchor4*") { throw "patch anchor not found in nego.c" }
      $negoLog = "`tWLog_INFO(TAG, `"gdterm redirect x224: token=%d cookie=%s proto=0x%x`", (int)nego->RoutingTokenLength, nego->cookie ? nego->cookie : `"(null)`", (unsigned)nego->RequestedProtocols);`n`tif (nego->RoutingToken)`n`t{`n`t`tWLog_INFO(TAG, `"gdterm redirect x224 token bytes (gdterm hexdump):`");`n`t`twinpr_HexDump(TAG, WLOG_INFO, nego->RoutingToken, (int)nego->RoutingTokenLength);`n`t}`n"
      $patched4 = $src4.Replace($anchor4, $negoLog + $anchor4)
      # winpr/print.h for nego.c (winpr_HexDump)
      $patched4 = $patched4 -replace '#include <winpr/crt.h>', "#include <winpr/crt.h>`n#include <winpr/print.h>"
      Set-Content -Path $negoC -Value $patched4 -NoNewline
      Write-Host "Patched nego.c: x224 routing token diagnostics"
      # ---- nego.c: hex dump full X.224 CR (before transport_write) + X.224 CC (after receive) ----
      # X.224 CR dump: stream is fully built (tpkt_write_header, tpdu_write_connection_request,
      # cookie/token, RDP_NEG_REQ) — sealed and ready to transmit. Dump BEFORE transport_write.
      $anchor9 = "rc = (transport_write(nego->transport, s) >= 0);"
      if ($patched4.Contains($anchor9) -eq $false) { throw "patch anchor9 not found in nego.c" }
      $x224CrDump = "`tWLog_INFO(TAG, `"gdterm redirect x224 cr (%d bytes) (gdterm hexdump):`", (int)Stream_Length(s));`n`twinpr_HexDump(TAG, WLOG_INFO, Stream_Buffer(s), (int)Stream_Length(s));`n"
      $patched4 = $patched4.Replace($anchor9, ($x224CrDump + $anchor9))
      # X.224 CC dump: stream has just been read via transport_read_pdu, before nego_recv parses it.
      $anchor10 = "status = nego_recv(nego->transport, s, nego);"
      if ($patched4.Contains($anchor10) -eq $false) { throw "patch anchor10 not found in nego.c" }
      $x224CcDump = "`tWLog_INFO(TAG, `"gdterm redirect x224 cc (%d bytes) (gdterm hexdump):`", (int)Stream_Length(s));`n`twinpr_HexDump(TAG, WLOG_INFO, Stream_Buffer(s), (int)Stream_Length(s));`n"
      $patched4 = $patched4.Replace($anchor10, ($x224CcDump + $anchor10))
      # ---- nego.c: token CR 恒带 RDP_NEG_REQ（对齐 mstsc 黄金样本）+ 协商结果诊断 ----
      # v0.1.161 黄金样本（被接受的 token 重连 c57179）：80B CR = 19B 头 + 61B token +
      # 8B RDP_NEG_REQ(requestedProtocols=0x0)。RDP-only 重连 RequestedProtocols=0 时
      # 原条件不会写 NEG 块（72B CR），与网关期望的形状不符，故 token 存在时恒写。
      $anchor13 = "if ((nego->RequestedProtocols > PROTOCOL_RDP) || (nego->sendNegoData))"
      if ($patched4.Contains($anchor13) -eq $false) { throw "patch anchor13 not found in nego.c" }
      $negoCond = "`t/* gdterm patch: mstsc sends RDP_NEG_REQ(requestedProtocols=0) even for a`n`t * legacy-RDP token reconnect (v0.1.161 golden CR: 19B header + 61B token +`n`t * 8B NEG_REQ 01 00 0008 00000000). Without this an RDP-only token CR omits`n`t * the NEG block (72B CR) and no longer matches the gateway's expected shape. */`n`tif ((nego->RequestedProtocols > PROTOCOL_RDP) || nego->sendNegoData || (nego->RoutingTokenLength > 0))"
      $patched4 = $patched4.Replace($anchor13, $negoCond)
      # 协商结果诊断（req/sel）：sel=0x0 = 网关只回 li==6（legacy RDP）。
      # C# FreeRdpClient 据此在 token 进程级重启时附 /sec:rdp 重放 0x0 请求。
      $anchor14 = "settings->NegotiationFlags = nego->flags;"
      if ($patched4.Contains($anchor14) -eq $false) { throw "patch anchor14 not found in nego.c" }
      $negoDone = "`tWLog_INFO(TAG, `"gdterm redirect nego done: req=0x%x sel=0x%x`", (unsigned)nego->RequestedProtocols, (unsigned)nego->SelectedProtocol);`n"
      $patched4 = $patched4.Replace($anchor14, ($anchor14 + "`n" + $negoDone))
      Set-Content -Path $negoC -Value $patched4 -NoNewline
      Write-Host "Patched nego.c: full X.224 CR + CC hex dumps + token CR carries RDP_NEG_REQ + nego done diag"


      # ---- connection.c: auto-reconnect 循环重挂 routing token（rdp_reset 释放 nego 会丢 token）----
      $anchor5 = "`tstatus = rdp_client_connect(rdp);`n`n`tif (status)`n`t`tstatus = rdp_client_reconnect_channels(rdp, FALSE);"
      if ($src2.Contains($anchor5) -eq $false) { throw "patch anchor5 not found in connection.c" }
      $tokenFix = "`tif ((rdp->settings->RedirectionFlags & LB_LOAD_BALANCE_INFO) && rdp->settings->LoadBalanceInfo &&`n`t    (rdp->settings->LoadBalanceInfoLength > 0))`n`t{`n`t`tWLog_INFO(TAG, `"gdterm redirect: auto-reconnect re-attaching routing token (%d bytes)`", (int)rdp->settings->LoadBalanceInfoLength);`n`t`tnego_set_routing_token(rdp->nego, rdp->settings->LoadBalanceInfo, rdp->settings->LoadBalanceInfoLength);`n`t}`n`t/* gdterm patch: auto-reconnect targets the same gateway - it must also`n`t * reuse the negotiated security mode for LB-token resume (see the lock in`n`t * the redirect path above). */`n`tif (rdp->settings->SelectedProtocol == PROTOCOL_RDP)`n`t{`n`t`tWLog_INFO(TAG, `"gdterm redirect: reconnect locked to legacy RDP`");`n`t`trdp->settings->TlsSecurity = FALSE;`n`t`trdp->settings->NlaSecurity = FALSE;`n`t`trdp->settings->ExtSecurity = FALSE;`n`t`trdp->settings->RdpSecurity = TRUE;`n`t}`n"
      $reconDiag = "`tWLog_INFO(TAG, `"gdterm redirect: reconnect status=%d proto=0x%x`", status, (unsigned)nego_get_selected_protocol(rdp->nego));`n"
      $patched2b = $patched2.Replace($anchor5, ($tokenFix + $anchor5 + "`n" + $reconDiag))
      Set-Content -Path $connC -Value $patched2b -NoNewline
      Write-Host "Patched connection.c: auto-reconnect re-attaches LB routing token"

      # ---- client.c: LOGOFF_BY_USER 也走 auto-reconnect（mstsc 被踢后静默重连的仿真）----
      # 堡垒机对 token 重连的处理是注销被路由的会话并发 LOGOFF_BY_USER；
      # mstsc 不看错误码照样静默重连（第二次全新连接重新拿登录页），
      # FreeRDP 的 client_auto_reconnect_ex 对 LOGOFF_BY_USER 走 default: return FALSE 直接退出。
      $clientC = Join-Path $root 'client\common\client.c'
      $src5 = Get-Content $clientC -Raw
      $anchor8 = "`t`tdefault:`n`t`t`treturn FALSE;`n`t}`n`n`tif (!settings->AutoReconnectionEnabled)"
      if ($src5.Contains($anchor8) -eq $false) { throw "patch anchor8 not found in client.c" }
      $logoffCase = "`t`tcase ERRINFO_LOGOFF_BY_USER:`n`t`t`t/* gdterm: bastion gateways log off the parked LB-token session when the`n`t`t`tredirect reconnect arrives; mstsc recovers by silently reconnecting. Drop`n`t`t`tthe routing token so retries open a fresh session, and let the retry loop run. */`n`t`t`tsettings->LoadBalanceInfoLength = 0;`n`t`t`tWLog_WARN(TAG, `"gdterm redirect: LOGOFF_BY_USER - dropped routing token, retrying`");`n`t`t`tbreak;`n"
      $patched5 = $src5.Replace($anchor8, ($logoffCase + $anchor8))
      Set-Content -Path $clientC -Value $patched5 -NoNewline
      Write-Host "Patched client.c: auto-reconnect retries on LOGOFF_BY_USER (mstsc-like)"

      # ---- gdterm: redirect 重连前恢复客户端原始身份指纹 ----
      # 抓包实证（v0.1.161 rdp-dump）：wfreerdp 首连 CI 为 RDP10.7/2296x1217/0x1b 加密组，
      # 被 NetScaler 类网关停靠的会话即以此指纹登记；redirect 重连的 CI 却变成
      # RDP5/1024x768/0x1（首段会话中 ServerCore/caps 把 settings 降级），网关指纹
      # 不匹配 → LOGOFF_BY_USER。mstsc 重连 CI 与首连一致所以存活。
      # 补丁：首次 rdp_client_connect 入口快照 RdpVersion/Width/Height/ColorDepth/
      # EncryptionMethods 到 rdpRdp 新增字段；rdp_client_redirect 重连前恢复。
      $rdpH = Join-Path $root 'libfreerdp\core\rdp.h'
      $srcH = Get-Content $rdpH -Raw
      $aH = "`tUINT64 outPackets;"
      $snapH = "`t/* gdterm: original client identity snapshot (redirect reconnect) */`n`tUINT32 gds_RdpVersion;`n`tUINT32 gds_Width;`n`tUINT32 gds_Height;`n`tUINT32 gds_ColorDepth;`n`tUINT32 gds_EncMethods;`n`tUINT32 gds_SnapValid;"
      if ($srcH -notlike "*$aH*") { throw "patch anchor not found in rdp.h" }
      if ($srcH.Contains('gds_RdpVersion') -eq $false) {
        $patchedH = $srcH.Replace($aH, $aH + "`n" + $snapH)
        Set-Content -Path $rdpH -Value $patchedH -NoNewline
      }
      $connC2 = Join-Path $root 'libfreerdp\core\connection.c'
      $srcC = Get-Content $connC2 -Raw
      # a) 快照：首次 rdp_client_connect 入口（FIPS 块之前），仅当无重定向历史
      $aSnap = "`tif (settings->FIPSMode || winpr_FIPSMode())"
      if ($srcC.Contains($aSnap) -eq $false) { throw "snapshot anchor not found in connection.c" }
      if ($srcC.Contains('gds_SnapValid') -eq $false) {
        $snapC = "/* gdterm: snapshot original client identity before first negotiation */`n`tif ((settings->RedirectionFlags == 0) && !rdp->gds_SnapValid) {`n`t`trdp->gds_RdpVersion = settings->RdpVersion; rdp->gds_Width = settings->DesktopWidth;`n`t`trdp->gds_Height = settings->DesktopHeight; rdp->gds_ColorDepth = settings->ColorDepth;`n`t`trdp->gds_EncMethods = settings->EncryptionMethods; rdp->gds_SnapValid = 1;`n`t}`n"
        $srcC = $srcC.Replace($aSnap, $snapC + $aSnap)
      }
      # b) 恢复：rdp_client_redirect 的 rdp_client_connect 之前（锚点=已被 credential-clear 补丁改写后的块）
      $aRest = "status = rdp_client_connect(rdp);`n`n`tif (status)`n`t`tstatus = rdp_client_reconnect_channels(rdp, TRUE);"
      if ($srcC.Contains($aRest) -eq $false) { throw "restore anchor not found in connection.c" }
      if ($srcC.Contains('restore identity') -eq $false) {
        $restC = "`tif (rdp->gds_SnapValid) {`n`t`tWLog_INFO(TAG, `"gdterm redirect: restore identity w=%u h=%u ver=0x%08x depth=%u enc=0x%08x`", rdp->gds_Width, rdp->gds_Height, rdp->gds_RdpVersion, rdp->gds_ColorDepth, rdp->gds_EncMethods);`n`t`tsettings->RdpVersion = rdp->gds_RdpVersion; settings->DesktopWidth = rdp->gds_Width;`n`t`tsettings->DesktopHeight = rdp->gds_Height; settings->ColorDepth = rdp->gds_ColorDepth;`n`t`tsettings->EncryptionMethods = rdp->gds_EncMethods;`n`t}`n"
        $srcC = $srcC.Replace($aRest, $restC + $aRest)
      }
      Set-Content -Path $connC2 -Value $srcC -NoNewline
      Write-Host "Patched rdp.h+connection.c: identity snapshot/restore on redirect"



      # ---- FreeRDP 旧补丁已移除 ----
      # 原补丁在 nego_recv li==6 分支强制 redirect 重连 FAIL（RoutingToken>0 && HYBRID），
      # 但 NetScaler 只支持 legacy RDP（li==6 是常态），补丁阻止了唯一可行的 legacy RDP 路径。
      # C# 层已改：/sec:nla 仅 ForceNLA=true 时传，redirect 重连走自由协商（li==6 → FINAL）。

      # ---- OpenSSL 开发库（探测预装路径，否则 choco 安装；2.x 强制依赖 OpenSSL）----
      function Find-OpenSslRoot {
        foreach ($p in @('C:\OpenSSL-Win64','C:\Program Files\OpenSSL-Win64','C:\Program Files\OpenSSL',
                         'C:\OpenSSL-v111-win64','C:\OpenSSL-v30-win64','C:\OpenSSL-v3-win64')) {
          if (Test-Path (Join-Path $p 'include\openssl\ssl.h')) { return $p }
        }
        return $null
      }
      $ossl = Find-OpenSslRoot
      if (-not $ossl) {
        Write-Host "Installing OpenSSL via Chocolatey..."
        choco install openssl --yes --no-progress | Out-Null
        $ossl = Find-OpenSslRoot
      }
      if (-not $ossl) { throw "OpenSSL development libraries not found after choco install" }
      Write-Host "OpenSSL root: $ossl"

      # ---- CMake 配置 + 编译（静态 CRT 免 VC redist、静态通道、最小依赖）----
      # 坑：CMake 把警告写到 stderr，PS5.1 在 EAP=Stop 下会把原生进程的 stderr
      # 输出当 ErrorRecord 终止 —— 此段切回 Continue，只以 $LASTEXITCODE 判定成败
      $ErrorActionPreference = 'Continue'
      $bld = "$env:TEMP\freerdp-build"
      if (Test-Path $bld) { Remove-Item -Recurse -Force $bld }
      # CMake 4.x 移除了对 cmake_minimum_required(<3.5) 的兼容，
      # FreeRDP 2.11.7 声明的是 2.8 —— 用官方逃生门变量放行；
      # 静态 CRT 要求全静态（BUILD_SHARED_LIBS=OFF）→ 产物为单个自包含 wfreerdp.exe，
      # OpenSSL 同步用 /MT 静态库，避免 /MT 主程序混链 /MD 库的 CRT 状态问题
      cmake -S $root -B $bld -G "Visual Studio 17 2022" -A x64 `
        "-DCMAKE_BUILD_TYPE=Release" `
        "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
        "-DOPENSSL_ROOT_DIR=$($ossl -replace '\\','/')" `
        "-DWITH_CLIENT_COMMON=ON" "-DWITH_CLIENT=ON" `
        "-DWITH_SERVER=OFF" "-DWITH_SERVER_CHANNELS=OFF" `
        "-DBUILD_TESTING=OFF" "-DWITH_SAMPLE=OFF" "-DWITH_MANPAGES=OFF" `
        "-DWITH_CAIRO=OFF" "-DWITH_JPEG=OFF" "-DWITH_SWSCALE=OFF" "-DWITH_DSP_FFMPEG=OFF" `
        "-DWITH_GSSAPI=OFF" "-DWITH_ICU=OFF" "-DCHANNEL_URBDRC=OFF" `
        "-DBUILTIN_CHANNELS=ON" "-DMSVC_RUNTIME=static" `
        "-DBUILD_SHARED_LIBS=OFF" "-DOPENSSL_USE_STATIC_LIBS=ON"
      if ($LASTEXITCODE -ne 0) { throw "cmake configure failed exit=$LASTEXITCODE" }
      cmake --build $bld --config Release -- /m /v:m
      if ($LASTEXITCODE -ne 0) { throw "FreeRDP build failed exit=$LASTEXITCODE" }

      # ---- 收集产物 ----
      # 主程序 exe：全静态构建产物，来自构建树 Release 目录
      $f = Get-ChildItem -Path $bld -Recurse -Filter 'wfreerdp.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
      if ($f) { Copy-Item $f.FullName $frBin -Force; Write-Host "Collected $($f.FullName) ($([math]::Round($f.Length/1MB,1)) MB)" }
      else { throw "Build output missing: wfreerdp.exe" }
      # OpenSSL 运行时 DLL 必须随包分发：FreeRDP 2.x 自带的 cmake/FindOpenSSL.cmake
      # 覆盖了 CMake 内置 FindOpenSSL 模块，OPENSSL_USE_STATIC_LIBS=ON 对它无效 ——
      # wfreerdp.exe 实际动态导入 libcrypto-1_1-x64.dll/libssl-1_1-x64.dll（0.1.92–0.1.107
      # 全部版本 PE 导入表已验证）。放在 exe 同目录由加载器按「应用程序目录」优先命中；
      # DLL 名称随 OpenSSL 大版本漂移（1_1 → 3-x），故递归通配收集而非硬编码文件名。
      $osslDlls = Get-ChildItem -Path $ossl -Recurse -Include 'libcrypto*.dll','libssl*.dll' -ErrorAction SilentlyContinue
      if (-not $osslDlls) { throw "No OpenSSL runtime DLLs found under $ossl" }
      $seen = @{}
      foreach ($d in $osslDlls) {
        if ($seen.ContainsKey($d.Name)) { continue }
        $seen[$d.Name] = $true
        Copy-Item $d.FullName (Join-Path $frBin $d.Name) -Force
        Write-Host "Collected $($d.Name) <- $($d.FullName)"
      }

      # ---- 冒烟测试：/version 能正常退出 ⇒ 加载器依赖完整 ----
      # 缺 DLL 时加载器默认弹模态错误框会挂死 CI —— 先 SetErrorMode(3)，
      # 子进程继承后缺 DLL 直接退码 STATUS_DLL_NOT_FOUND 而非弹框。
      Add-Type -Namespace Native -Name Kernel32 -MemberDefinition '
        [DllImport("kernel32.dll")] public static extern uint SetErrorMode(uint uMode);'
      [Native.Kernel32]::SetErrorMode(3) | Out-Null   # SEM_FAILCRITICALERRORS|SEM_NOOPENFILEERRORBOX
      $wfe = Join-Path $frBin 'wfreerdp.exe'
      $pi = New-Object System.Diagnostics.ProcessStartInfo
      $pi.FileName = $wfe; $pi.Arguments = '/version'
      $pi.UseShellExecute = $false; $pi.CreateNoWindow = $true; $pi.RedirectStandardOutput = $true
      $proc = [System.Diagnostics.Process]::Start($pi)
      $verOut = $proc.StandardOutput.ReadToEnd()
      if (-not $proc.WaitForExit(20000)) { try { $proc.Kill() } catch {}; throw "wfreerdp /version timed out (20s)" }
      Write-Host "Smoke: wfreerdp /version => exit=$($proc.ExitCode) out=$($verOut.Trim().Substring(0, [Math]::Min(120, $verOut.Trim().Length)))"
      if ($proc.ExitCode -ne 0) { throw "wfreerdp smoke FAIL exit=$($proc.ExitCode) — loader/runtime deps incomplete (missing DLL?)" }

      # Apache-2.0 许可证随分发保留
      $lic = Join-Path $root 'LICENSE'
      if (Test-Path $lic) { Copy-Item $lic (Join-Path $frBin 'LICENSE.FreeRDP.txt') -Force }
      Write-Host "===== FreeRDP engine ready: $((Get-ChildItem $frBin -File).Count) files ====="

# classic csproj + PackageReference：先 nuget restore，再 MSBuild Restore
before_build:
  - ps: |
      Write-Host "Restoring NuGet packages..."
      nuget restore gdterm.sln -NonInteractive
      if (-not $?) {
        Write-Host "nuget restore soft-fail; trying msbuild /t:Restore"
      }
      msbuild gdterm.sln /t:Restore /p:Configuration=$env:CONFIGURATION /p:Platform="Any CPU" /v:m
      if (-not $?) { throw "Package restore failed" }

build:
  project: gdterm.sln
  verbosity: minimal
  parallel: true

test_script:
  - ps: |
      $testExe = "src\Gdterm.Tests\bin\$env:CONFIGURATION\Gdterm.Tests.exe"
      if (-not (Test-Path $testExe)) {
        $alt = Get-ChildItem -Path src\Gdterm.Tests -Recurse -Filter Gdterm.Tests.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($alt) { $testExe = $alt.FullName }
      }
      if (-not (Test-Path $testExe)) { throw "Gdterm.Tests.exe not found" }
      Write-Host "Running $testExe"
      & $testExe
      if ($LASTEXITCODE -ne 0) { throw "Tests failed exit=$LASTEXITCODE" }

after_test:
  - ps: |
      # ===== 绿色版最小化打包 =====
      # 目标：托管 DLL 全部用 ILRepack 合进 gdterm.exe，产物只剩
      #   gdterm.exe + winpty.dll + winpty-agent.exe + winpty.exe + data/骨架
      # 删除所有 .txt / .pdb / .xml / .config 噪声文件。
      $ui = "src\Gdterm.UI\bin\$env:CONFIGURATION"
      if (-not (Test-Path (Join-Path $ui "gdterm.exe"))) {
        Write-Host "UI bin missing — skip portable artifact"
        return
      }

      # ===== 步骤 0：入库二进制完整性自检 =====
      # 指纹钉在下方；更换任何 lib 二进制必须同步更新对应常量并在提交说明里写明来源
      $pins = [ordered]@{
        'lib\winpty\winpty.dll'       = '5d892d04b5051d998907147c514f6ae058e5d0bbbf98e2ed78cd1d30dd5d0360'
        'lib\winpty\winpty-agent.exe' = '84f6ce4535f7f3e09b2aef7d833b9a99ba675b304576d188a1db349246e41378'
        'lib\winpty\winpty.exe'       = '1a8e92e0b03f7f83aa344b0dcfd141354b5bdaf6c824edbe872a95ab996d87b6'
        'vendor\fzf\fzf.exe'             = '2c14a927c1ce5bad37e80630685e3149d442a55594a935c57548742b9dc2b9b2'
        'vendor\fd\fd.exe'               = 'c089c9ee1e412a111d65c917a95c757b4e192041f316a52535bfaa3e9e03429f'
      }
      foreach ($k in $pins.Keys) {
        $p = Join-Path $env:APPVEYOR_BUILD_FOLDER $k
        if (-not (Test-Path $p)) { throw "Bundled binary missing: $k" }
        $h = (Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
        if ($h -ne $pins[$k]) { throw "Binary integrity FAIL: $k expected=$($pins[$k]) actual=$h" }
      }
      Write-Host "Bundled binaries sha256 verified: $($pins.Count) files OK"

      $out = "dist\gdterm"
      if (Test-Path $out) { Remove-Item -Recurse -Force $out }
      New-Item -ItemType Directory -Path $out | Out-Null

      # 1) 先把 UI 输出目录所有东西拷过去（含 Gdterm.*.dll / Renci.SshNet.dll /
      #    KeePassLib.dll / VtNetCore.dll / gdterm.exe / *.pdb / *.xml / *.config）
      Copy-Item -Path (Join-Path $ui '*') -Destination $out -Recurse -Force

      # 2) 补齐 lib 下的 VtNetCore.dll（若 csproj 的 HintPath Private 没拷过来）
      if (Test-Path "lib\VtNetCore.dll") {
        Copy-Item "lib\VtNetCore.dll" $out -Force
      }

      # 3) winpty（Win7/Server2008 本地终端 PTY fallback）—— 原生二进制集中放 lib\，
      #     winpty.dll 与 winpty-agent.exe 必须同目录（dll 启动 agent）；
      #     运行时 Program.cs 已 SetDllDirectory(lib) 让 DllImport(winpty.dll) 定位 lib\。
      if (Test-Path "lib\winpty") {
        $libDir = Join-Path $out "lib"
        New-Item -ItemType Directory -Path $libDir -Force | Out-Null
        Copy-Item "lib\winpty\winpty.dll"      $libDir -Force
        Copy-Item "lib\winpty\winpty-agent.exe" $libDir -Force
        Copy-Item "lib\winpty\winpty.exe"     $libDir -Force
      }

      # 3b) FreeRDP（wfreerdp.exe 进程嵌入引擎）—— 集中放 lib\freerdp\（业界 bin/lib 分类），
      #     原生 DLL 需与 exe 同目录共存；许可证文件随子目录保留（Apache-2.0 要求）。
      #     来源优先级：vendor\freerdp\（手工放置覆盖）> freerdp-bin\（install 阶段源码构建产物）
      $frSrc = $null
      if ((Test-Path "vendor\freerdp\wfreerdp.exe") -or
          (Get-ChildItem "vendor\freerdp" -Filter *.exe -ErrorAction SilentlyContinue)) {
        $frSrc = "vendor\freerdp"
      } elseif (Test-Path "$env:APPVEYOR_BUILD_FOLDER\freerdp-bin\wfreerdp.exe") {
        $frSrc = "$env:APPVEYOR_BUILD_FOLDER\freerdp-bin"
      }
      if ($frSrc) {
        $frDir = Join-Path $out "lib\freerdp"
        New-Item -ItemType Directory -Path $frDir -Force | Out-Null
        if ($frSrc -eq "vendor\freerdp") { Copy-Item "vendor\freerdp\*" $frDir -Recurse -Force }
        else { Copy-Item "$env:APPVEYOR_BUILD_FOLDER\freerdp-bin\*" $frDir -Force }
        Write-Host "Packed FreeRDP from ${frSrc}: $((Get-ChildItem $frDir -File).Count) files"

        # 打包后的引擎同样必须可加载（防拷贝步骤遗漏 DLL；SetErrorMode 防缺 DLL 弹框挂死 CI）
        if (-not ([System.Management.Automation.PSTypeName]'Native.Kernel32').Type) {
          Add-Type -Namespace Native -Name Kernel32 -MemberDefinition '
            [DllImport("kernel32.dll")] public static extern uint SetErrorMode(uint uMode);'
        }
        [Native.Kernel32]::SetErrorMode(3) | Out-Null
        $pi2 = New-Object System.Diagnostics.ProcessStartInfo
        $pi2.FileName = Join-Path (Join-Path $env:APPVEYOR_BUILD_FOLDER 'dist\gdterm\lib\freerdp') 'wfreerdp.exe'
        $pi2.WorkingDirectory = $env:APPVEYOR_BUILD_FOLDER
        $pi2.Arguments = '/version'
        $pi2.UseShellExecute = $false; $pi2.CreateNoWindow = $true; $pi2.RedirectStandardOutput = $true
        $proc2 = [System.Diagnostics.Process]::Start($pi2)
        $null = $proc2.StandardOutput.ReadToEnd()
        if (-not $proc2.WaitForExit(20000)) { try { $proc2.Kill() } catch {}; throw "packed wfreerdp /version timeout" }
        if ($proc2.ExitCode -ne 0) { throw "packed wfreerdp cannot load (exit=$($proc2.ExitCode)) — lib\freerdp\ 目录缺运行库 DLL" }
        Write-Host "Packed FreeRDP smoke OK (exit=$($proc2.ExitCode))"
      } else {
        Write-Warning "No FreeRDP engine available — RDP falls back to mstscax ActiveX at runtime"
      }

      # 3c) fzf / fd（本地终端随附 CLI 工具）—— 业界布局 bin\ 放可执行；运行时 Program.cs
      #     把 bin\ 加入 PATH，终端子进程直接敲 fzf/fd 即可用。
      #     均为官方 Win7 兼容版：fzf v0.65.2（末代 Win7 支持）、fd v10.2.0（Rust 1.77 锁定构建）
      $binDir = Join-Path $out "bin"
      New-Item -ItemType Directory -Path $binDir -Force | Out-Null
      foreach ($tool in @('fzf','fd')) {
        $exe = "vendor\${tool}\${tool}.exe"
        if (Test-Path $exe) {
          Copy-Item "vendor\${tool}\*" $binDir -Recurse -Force
          Write-Host ("Packed {0} into bin\" -f $tool)
        } else {
          Write-Warning "vendor\${tool}\${tool}.exe missing - skipped"
        }
      }

      # 4) 从各项目 bin / NuGet 缓存补齐传递依赖（KeePassLib / SSH.NET）
      $depNames = @('KeePassLib.dll','Renci.SshNet.dll')
      foreach ($name in $depNames) {
        if (-not (Test-Path (Join-Path $out $name))) {
          $found = Get-ChildItem -Path src -Recurse -Filter $name -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'bin\\' + $env:CONFIGURATION } |
            Select-Object -First 1
          if (-not $found) {
            $found = Get-ChildItem -Path "$env:USERPROFILE\.nuget\packages" -Recurse -Filter $name -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if ($found) { Copy-Item $found.FullName $out -Force; Write-Host "Packed dependency: $name" }
          else { Write-Warning "Missing dependency in portable package: $name" }
        }
      }

      # 5) 安装 ILRepack 并合并所有托管 DLL 进 gdterm.exe
      #    用 dotnet global tool 装 ILRepack.Tool，并把 ~/.dotnet/tools 加到 PATH。
      # 不可达的 dotnet tool 路径刪除，直接用 NuGet 独立包（以免失败后兜底在 0.1.44 里已证仍引入传递依赖问题）
      # 5) 收集 out 下所有托管 DLL 作为 ILRepack 输入与 /lib 搜索路径
      $allDlls = Get-ChildItem -Path $out -Filter *.dll | Where-Object { $_.Name -ne 'winpty.dll' } | Select-Object -ExpandProperty FullName
      $primeExe = Join-Path $out 'gdterm.exe'
      $asmPaths = @($primeExe) + ($allDlls | Where-Object { $_ -ne $primeExe })
      Write-Host "[ILRepack] merging $($asmPaths.Count) files into gdterm.exe"
      # 安装独立 ILRepack NuGet 包（带 ILRepack.exe，不依赖 dotnet tool PATH）
      $pkgDir = Join-Path "$env:USERPROFILE\.nuget\packages" "ilrepack"
      if (-not (Test-Path (Join-Path $pkgDir '2.0.18'))) {
        nuget install ILRepack -Version 2.0.18 -OutputDirectory "$env:USERPROFILE\.nuget\packages" -NonInteractive -Verbosity quiet 2>$null
      }
      $ilrepack = Get-ChildItem -Path $pkgDir -Recurse -Filter "ILRepack.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
      if (-not $ilrepack) { throw "ILRepack.exe not found under $pkgDir" }
      Write-Host "ILRepack: $ilrepack"
      # SSH.NET 2026.0.0 传递依赖（-> BouncyCastle.Cryptography / Microsoft.Bcl.Cryptography / Microsoft.Extensions.Logging.Abstractions）
      # 旧版 2024.1.0 经 SshNet.Security 引入的 Microsoft.Bcl.AsyncInterfaces 等一并保留：
      # 未被引用时不会出现在 bin，下方循环 Test-Path 为假即跳过，零副作用。
      $transitiveNames = @('BouncyCastle.Cryptography.dll','Microsoft.Bcl.Cryptography.dll','Microsoft.Extensions.Logging.Abstractions.dll','Microsoft.Bcl.AsyncInterfaces.dll','System.Threading.Tasks.Extensions.dll','System.Memory.dll','System.Buffers.dll','System.Runtime.CompilerServices.Unsafe.dll','System.Numerics.Vectors.dll','System.ValueTuple.dll')
      foreach ($name in $transitiveNames) {
        if (-not (Test-Path (Join-Path $out $name))) {
          $found = Get-ChildItem -Path src -Recurse -Filter $name -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'bin\\' + $env:CONFIGURATION } |
            Select-Object -First 1
          if ($found) { Copy-Item $found.FullName $out -Force; Write-Host "Packed transitive: $name" }
        }
      }
      # PowerShell 调 ILRepack：长参数语法 --out=FILE / --lib=DIR 避免 NDesk.Options
      # 在 '/out:val' 形式下把后续 '/' 开头的开关吞进 out 路径 (ILRepack 2.0.18 已知parse怪癖)。
      $outExe = Join-Path $out 'gdterm.exe'
      $argsArr = @("--out=$outExe", "--lib=$out", '/wildcards', '/copyattrs', '/allowdup', '/internalize') + $asmPaths
      & $ilrepack $argsArr
      if ($LASTEXITCODE -ne 0) { throw "ILRepack failed exit=$LASTEXITCODE" }

      # 6) 合并完成后删除被合并进 exe 的所有托管 DLL（原生 winpty.dll 已在 lib\ 不受影响）
      foreach ($n in (Get-ChildItem -Path $out -Filter *.dll | Where-Object { $_.Name -ne 'winpty.dll' } | Select-Object -ExpandProperty Name)) {
        Remove-Item (Join-Path $out $n) -Force
      }

      # 7) 删除噪声文件：.pdb / .xml / .config / .txt（含 LICENSE.winpty.txt、README 等）
      #    排除 freerdp\ 子目录：Apache-2.0 要求随分发保留许可证文本
      Get-ChildItem -Path $out -Recurse -File |
        Where-Object { $_.Extension -in '.pdb','.xml','.config','.txt' -and $_.FullName -notmatch '\\lib\\freerdp\\' } |
        ForEach-Object { Remove-Item $_.FullName -Force; Write-Host "Removed noise: $($_.Name)" }

      # 8) 便携数据骨架（空 —— 无密钥）
      New-Item -ItemType Directory -Path (Join-Path $out "data\config\tools") -Force | Out-Null
      New-Item -ItemType Directory -Path (Join-Path $out "data\logs") -Force | Out-Null

      # 9) 最终产物清单：顶层仅 gdterm.exe + SHA256SUMS.txt，原生依赖分类入 bin\lib\
      Write-Host ""
      Write-Host "===== Portable layout (final) ====="
      Get-ChildItem $out -File | ForEach-Object { Write-Host ("  {0,-25} {1,8:N0} bytes" -f $_.Name, $_.Length) }
      foreach ($sub in @('bin','lib','data')) {
        $sd = Join-Path $out $sub
        if (Test-Path $sd) { Write-Host ("  [{0}\\] {1} files" -f $sub, (Get-ChildItem $sd -Recurse -File).Count) }
      }
      Write-Host "===== Top-level files: $((Get-ChildItem $out -File).Count) ====="
      Write-Host "Portable layout ready: $out"

      # 10) 发布校验和：SHA256SUMS.txt 随包分发（用户可逐文件核验），
      #     相对路径格式与 sha256sum -c 兼容；内容纯 ASCII，避免 BOM 干扰首行哈希
      $outRoot = (Resolve-Path $out).Path
      $lines = Get-ChildItem $out -Recurse -File |
        ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.FullName.Substring($outRoot.Length + 1) }
      Set-Content -Path (Join-Path $outRoot 'SHA256SUMS.txt') -Value $lines -Encoding Ascii
      Write-Host "SHA256SUMS.txt written: $($lines.Count) entries"

